# Filled by the Maven build (resource filtering). Read by the VanillaBP platform's
# AdapterPlatformVersion to fail with a guiding message if the platform integration on
# the classpath is older than the one this adapter was built against.
adapter.version=${project.version}
platform.version=${adapter-platform.version}
# The release line, read by Camunda8ReleaseLine and named in messages about what a cluster
# cannot do. The client is the lowest cluster version this build accepts.
camunda8.line=${camunda8.line}
camunda8.client=${camunda8.version}
