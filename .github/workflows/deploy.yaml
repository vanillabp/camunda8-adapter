name: Release
# Publishes to Maven Central through the profiles 'release' and 'central-portal' of
# io.vanillabp:release-parent, once per live release line and all from the SAME commit, so a
# fix exists on every line the moment it is committed. The version is not written into the
# POM: it is '${revision}', given per line as '<version>-<line>', for example '2.0.0-8.8',
# '2.0.0-8.9' and '2.0.0-8.10'. See README.md, section "Release lines".
#
# The workflow is the one of the Business Cockpit's Camunda 8 adapter, which releases its
# lines the same way. Somebody dispatches it by hand with the version. With the input 'train'
# it uploads nothing: every line keeps its bundle as an Actions artifact, one slot per line,
# and release-train.yaml in vanillabp/maven-release-parent uploads the bundles of all
# repositories of the train as one deployment. A dry run of that workflow is the rehearsal.
#
# The order of jobs is decision 31 in the repository's DECISIONS.md. The first job runs the
# whole line matrix against the commit which is released, every job which builds or signs or
# publishes comes after it, and no input skips it. A line which is red stops the release
# before anything is published, and the job 'ga-lines-verified' names that line.
"on":
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to release, without the line suffix (e.g. 2.0.0)"
        required: true
      train:
        description: "Release train, e.g. 2.0. Empty: this release uploads to Maven Central itself. Set: the bundle of every line is kept for release-train.yaml in maven-release-parent. Release the repositories of a train in the order of their dependencies: each release reads the bundles of the releases before it."
        required: false
        default: ""
concurrency:
  # One release of this repository at a time. Two releases at once would deploy the same
  # coordinates to Maven Central and write the same tag, and a release which was stopped
  # halfway leaves some lines on Central and the rest nowhere. The publish of snapshots
  # keeps its own group: it writes snapshots, never a fixed version.
  group: camunda8-adapter-release
  cancel-in-progress: false
permissions:
  contents: read
env:
  # release-versions.sh of maven-release-parent at a fixed commit, so a later change of the
  # script cannot break the release of an older commit. A new version of the script comes
  # with a pull request which moves this commit.
  RELEASE_VERSIONS_SH: "https://raw.githubusercontent.com/vanillabp/maven-release-parent/e6c840c50e2ed95412710828df00fa194924edf6/.github/scripts/release-versions.sh"
jobs:
  # Decision 31: the gate. The matrix builds and tests every line against its own cluster,
  # the preview line included, against the snapshots it resolves at this moment.
  lines:
    uses: ./.github/workflows/line-matrix.yaml
    secrets: inherit

  # Builds nothing, so it does not have to wait for the gate. A version which is no version
  # should fail in a minute, not after forty.
  version:
    runs-on: ubuntu-latest
    steps:
      - name: The version this release publishes
        env:
          VERSION: "${{ inputs.release_version }}"
        run: |
          # A line is appended to the version, so the input must not carry one itself.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "'${VERSION}' is no version of the form 2.0.0. Every line appends its own." >&2
            exit 1
          fi
          echo "Version ${VERSION}"
      - uses: actions/checkout@v7
      # A version on Maven Central never changes. Below that line nobody can use the version
      # of any line yet, so the job 'tag' may move the tag when a release of the same version
      # runs again.
      - name: Refuse a version which Maven Central has already
        env:
          VERSION: "${{ inputs.release_version }}"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/release-versions.sh" "$RELEASE_VERSIONS_SH"
          lines=$(sed -n 's|.*<id>line-\([0-9][^<]*\)</id>.*|\1|p' pom.xml)
          bash "$RUNNER_TEMP/release-versions.sh" unpublished $(for line in $lines; do echo "$VERSION-$line"; done)

  # The gate itself. It runs whatever the matrix did, and it says which lines were red, so
  # nobody has to open the matrix to find out. The answer of the matrix about the GA lines
  # is its output 'broken-ga-lines', and an empty one means the matrix never got far enough
  # to say.
  #
  # Decision 31 asks for more than the GA lines: a release waits for every current line, a
  # preview line included. So this job is red as well when the matrix as a whole is not
  # green. The Business Cockpit's Camunda 8 adapter asks the GA lines alone. Story 2081 is
  # where this adapter decides how a preview line is treated, and there is no preview line
  # today, so both readings wait for the same lines now.
  ga-lines-verified:
    if: always()
    needs: lines
    runs-on: ubuntu-latest
    steps:
      - name: Every line is green
        env:
          BROKEN: "${{ needs.lines.outputs.broken-ga-lines }}"
          RESULT: "${{ needs.lines.result }}"
        run: |
          echo "The matrix says ${RESULT}, and the GA lines which did not build are: ${BROKEN:-unknown}"
          case "$BROKEN" in
            none) ;;
            "")
              echo "The matrix did not get far enough to say which lines built, so nothing" >&2
              echo "here says this release is safe. Read the jobs of the matrix above." >&2
              exit 1 ;;
            *)
              echo "::error title=Release stopped::GA lines which did not build: ${BROKEN}"
              echo "A release publishes to Maven Central and cannot be taken back, so it" >&2
              echo "waits until they are green." >&2
              exit 1 ;;
          esac
          if [ "$RESULT" != "success" ]; then
            echo "::error title=Release stopped::Every GA line built, but the matrix is ${RESULT}."
            echo "A release waits for every current line, the preview line included" >&2
            echo "(decision 31). Read the jobs 'lines / line (...)' above." >&2
            exit 1
          fi
          echo "Every line built and tested green, so this release may go out."

  # The live lines are not maintained here: they are the line-* profiles of the parent POM,
  # read the same way as in line-matrix.yaml. So the release cannot fall behind the build.
  #
  # Every line is released, a preview line included, as in the Business Cockpit's Camunda 8
  # adapter. Story 2081 says a preview line is never released. When it is built, the list
  # below leaves out every line for which 'bin/line-preview.sh <line>' prints 'true'.
  discover:
    needs: [version, ga-lines-verified]
    runs-on: ubuntu-latest
    outputs:
      lines: "${{ steps.list.outputs.lines }}"
    steps:
      - uses: actions/checkout@v7
      - id: list
        name: Collect the release lines
        run: |
          list=$(sed -n 's|.*<id>line-\([0-9][^<]*\)</id>.*|\1|p' pom.xml \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "lines=${list}" >> "$GITHUB_OUTPUT"
          echo "Releasing lines: ${list}"

  # One line after the other, and the first one that cannot publish stops the rest. A
  # version on Maven Central cannot be published a second time, so a line which fails after
  # another one went out leaves a hole nobody can fill with the same version. Stopping at
  # once keeps that hole as small as it can be. In a train nothing goes out here, and each
  # line is one slot of the train.
  line:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        line: "${{ fromJSON(needs.discover.outputs.lines) }}"
    steps:
      - uses: actions/checkout@v7
      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # the bundle: "Bundle has content that does NOT have a .pom file". The runner image
      # ships 3.10 now, so the release brings its own 3.9. Remove this step once a plugin
      # version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          # the JDK the matrix tested with
          java-version: 25.0.5+8.0.LTS
          distribution: temurin
          cache: maven
          server-id: vanillabp-central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}"
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      # A release train builds the bundle of each release and keeps it as an Actions
      # artifact. The bundles of the train which are already there go into the local Maven
      # repository, so this build finds the versions which are not on Maven Central yet, the
      # platform's for example. See the README of maven-release-parent.
      - name: Read the bundles of the release train
        if: inputs.train != ''
        env:
          TRAIN: "${{ inputs.train }}"
          LINE: "${{ matrix.line }}"
          # reads the Actions artifacts of the other repositories, which GITHUB_TOKEN cannot
          GH_TOKEN: "${{ secrets.VANILLABP_USER_TOKEN }}"
        run: |
          # the shared part of a release train lives once, in maven-release-parent
          curl -fsSL -o "$RUNNER_TEMP/release-train.sh" \
            https://raw.githubusercontent.com/vanillabp/maven-release-parent/main/.github/scripts/release-train.sh
          bash "$RUNNER_TEMP/release-train.sh" prepare "$TRAIN" "$LINE"
      # main depends on SNAPSHOTs of spi-for-java and the platform until those are on Maven
      # Central. Every line gets their released versions here, from the bundles of the train
      # or from Maven Central. If one is in neither place, the release stops before anything
      # leaves this build, and the message names the repository to release first. The line
      # decides the Camunda version only, so every line gets the same versions. The job 'tag'
      # puts them into the commit it tags.
      - name: Use the released versions of VanillaBP
        env:
          TRAIN: "${{ inputs.train }}"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/release-versions.sh" "$RELEASE_VERSIONS_SH"
          bash "$RUNNER_TEMP/release-versions.sh" raise "$TRAIN"
          mkdir -p "$RUNNER_TEMP/release-versions"
          git diff > "$RUNNER_TEMP/release-versions/raised.patch"
          cp "$RUNNER_TEMP/raised-versions.txt" "$RUNNER_TEMP/release-versions/" 2>/dev/null || true
      # 'raise' changes io.vanillabp* only. Any other SNAPSHOT stops the release here, also one
      # of a library from outside VanillaBP. It has to be on Maven Central first, and main has
      # to name its released version.
      - name: No SNAPSHOT is left
        run: bash "$RUNNER_TEMP/release-versions.sh" no-snapshots
      - name: Keep the released versions for the tag
        uses: actions/upload-artifact@v7
        with:
          # the same for every line, so the line which comes last may replace it
          name: release-versions
          path: "${{ runner.temp }}/release-versions/"
          retention-days: 7
          overwrite: true
      # 'clean', because classes compiled against one Camunda client are binary compatible
      # with no other one, so a stale target/ from the previous line fails at runtime rather
      # than at compile time. The tests ran in the gate, against this commit. Failsafe does
      # not read '-DskipTests', hence '-DskipITs' as well.
      - name: "Release line ${{ matrix.line }}"
        # The publish of a snapshot builds the same modules without tests in a few minutes.
        # This one also signs and builds the javadoc jars. The lines release one at a time,
        # so a line which hangs holds every line after it.
        timeout-minutes: 60
        run: mvn --batch-mode --no-transfer-progress -DskipTests -DskipITs
          -Pline-${{ matrix.line }},release,central-portal
          -Drevision=${{ inputs.release_version }}-${{ matrix.line }}
          $TRAIN_ARGS clean deploy
        env:
          # builds the bundle and does not upload it
          TRAIN_ARGS: "${{ inputs.train != '' && '-Dcentral.skip.upload=true' || '' }}"
          # maven-gpg-plugin 3.2 reads the passphrase from this variable
          MAVEN_GPG_PASSPHRASE: "${{ secrets.MAVEN_GPG_PASSPHRASE }}"
          MAVEN_USERNAME: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}"
          MAVEN_PASSWORD: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}"
      # What went out, with the version every POM carries. A POM which still says
      # '${revision}' is refused by the Central Portal, and this is where it would show,
      # before a train carries it.
      - name: "What line ${{ matrix.line }} published"
        env:
          VERSION: "${{ inputs.release_version }}-${{ matrix.line }}"
        run: |
          set -euo pipefail
          bundle=target/central-publishing/central-bundle.zip
          if [ -f "$bundle" ]; then
            unzip -l "$bundle" | awk '{print $4}' | grep -E '\.(pom|jar)$' | sort
            if unzip -p "$bundle" '*.pom' | grep -F '${revision}'; then
              echo "A published POM still says \${revision}." >&2
              exit 1
            fi
          fi
          echo "Line ${{ matrix.line }} as ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
      - name: Pack the bundle for the release train
        if: inputs.train != ''
        env:
          TRAIN: "${{ inputs.train }}"
          LINE: "${{ matrix.line }}"
          VERSION: "${{ inputs.release_version }}-${{ matrix.line }}"
        run: bash "$RUNNER_TEMP/release-train.sh" pack "$TRAIN" "$LINE" "$VERSION"
      - name: Keep the bundle for the release train
        if: inputs.train != ''
        uses: actions/upload-artifact@v7
        with:
          # one name per repository and line: a new build of the same line replaces the old
          # one, and release-train.yaml takes the newest
          name: "release-train-${{ inputs.train }}-${{ github.event.repository.name }}-${{ matrix.line }}"
          path: "${{ runner.temp }}/release-train/"
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  tag:
    needs: line
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The released versions the lines were built with
        uses: actions/download-artifact@v8
        with:
          name: release-versions
          path: "${{ runner.temp }}/release-versions"
      - name: Tag the commit every line was built from
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # The lines were built with the released versions of VanillaBP, so the tag points at
          # a commit which has them. That commit is on no branch, and main keeps its SNAPSHOTs.
          if [ -s "$RUNNER_TEMP/release-versions/raised.patch" ]; then
            git apply "$RUNNER_TEMP/release-versions/raised.patch"
            { echo "Prepare release v$VERSION"; echo; cat "$RUNNER_TEMP/release-versions/raised-versions.txt"; } \
              | git commit -a -F -
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            # Maven Central has no line of this version, checked before the build, so a
            # release of the same version which runs again may move the tag
            echo "::warning::Tag $VERSION exists already. This release moves it to this build."
            git tag -f -a "$VERSION" -m "Release $VERSION, all lines"
            git push --force origin "refs/tags/$VERSION"
          else
            git tag -a "$VERSION" -m "Release $VERSION, all lines"
            git push origin "$VERSION"
          fi
        env:
          TRAIN: "${{ inputs.train }}"
          VERSION: "${{ inputs.release_version }}"
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ inputs.release_version }}"
          name: "v${{ inputs.release_version }}"
          generate_release_notes: true
          draft: true
