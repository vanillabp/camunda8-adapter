spring:
  datasource:
    generate-unique-name: true
  jpa:
    hibernate:
      ddl-auto: create
vanillabp:
  adapters:
    c8:
      type: camunda8
      name-clash-avoidance: use-prefix
      job-timeout: PT30S
  prioritized-adapters:
    - c8
  workflow-modules:
    test-app:
      adapters:
        c8:
          resources-location: classpath*:listeners
      workflows:
        ListenerProcess:
          allow-full-sync-with-bpms: true
          adapters:
            c8:
              allow-listeners: true
  outbox:
    poll-interval: PT0.5S
    attempt-frequency: PT0.5S
