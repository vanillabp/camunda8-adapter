spring:
  datasource:
    generate-unique-name: true
  jpa:
    hibernate:
      ddl-auto: create
vanillabp:
  adapters:
    c8:
      type: camunda8
      name-clash-avoidance: use-prefix
      job-timeout: PT30S
      async-task-timeout: PT2M
  prioritized-adapters:
    - c8
  workflow-modules:
    test-app:
      adapters:
        c8:
          resources-location: classpath*:it
          job-timeout: PT20S
      workflows:
        TaskProcess:
          adapters:
            c8:
              job-timeout: PT10S
          tasks:
            happyTask:
              adapters:
                c8:
                  job-timeout: PT2S
        AsyncProcess:
          tasks:
            asyncTask:
              adapters:
                c8:
                  job-timeout: PT2S
  outbox:
    poll-interval: PT0.5S
    attempt-frequency: PT0.5S
