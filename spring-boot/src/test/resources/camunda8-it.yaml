spring:
  datasource:
    generate-unique-name: true
  jpa:
    hibernate:
      ddl-auto: create
vanillabp:
  adapters:
    c8:
      type: camunda8
      name-clash-avoidance: use-prefix
      job-timeout: PT30S
      retry-backoff: PT30S
      async-task-lock-renewal: PT2M
      message-time-to-live: PT6H
  prioritized-adapters:
    - c8
  workflow-modules:
    test-app:
      adapters:
        c8:
          resources-location: classpath*:it
          job-timeout: PT20S
          retry-backoff: PT20S
          message-time-to-live: PT5H
      workflows:
        FailProcess:
          adapters:
            c8:
              retry-backoff: PT5S
        ModelledBackoffProcess:
          adapters:
            c8:
              retry-backoff: PT1S
        MessageProcess:
          messages:
            C8PaymentReceived:
              adapters:
                c8:
                  message-time-to-live: PT2S
        TaskProcess:
          adapters:
            c8:
              job-timeout: PT10S
              retry-backoff: PT10S
              message-time-to-live: PT4H
          tasks:
            happyTask:
              adapters:
                c8:
                  job-timeout: PT2S
                  retry-backoff: PT2S
          messages:
            OfferRequested:
              adapters:
                c8:
                  message-time-to-live: PT1M
        AsyncProcess:
          tasks:
            asyncTask:
              adapters:
                c8:
                  job-timeout: PT2S
        SyncProcess:
          tasks:
            syncApproved:
              adapters:
                c8:
                  fetch-variables: all
        FetchProcess:
          adapters:
            c8:
              retry-backoff: PT5S
          tasks:
            fetchAllTask:
              adapters:
                c8:
                  fetch-variables: all
  outbox:
    poll-interval: PT0.5S
    attempt-frequency: PT0.5S
