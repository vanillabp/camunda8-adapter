vanillabp:
  adapters:
    c8:
      type: camunda8
      rest-address: http://localhost:65535
      job-timeout: PT30S
      async-task-timeout: PT2M
  prioritized-adapters:
    - c8
  workflow-modules:
    test-app:
      adapters:
        c8:
          resources-location: classpath:test-app/processes
          job-timeout: PT20S
      workflows:
        TaskProcess:
          adapters:
            c8:
              job-timeout: PT10S
          tasks:
            happyTask:
              adapters:
                c8:
                  job-timeout: PT2S
